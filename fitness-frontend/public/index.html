<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="FitTrack - Your comprehensive fitness tracking and community platform. Track workouts, connect with trainers, find gyms, and share your fitness journey."
    />
    <meta name="keywords" content="fitness, workout, gym, trainer, health, wellness, tracking, journal, community" />
    <meta name="author" content="FitTrack Team" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FitTrack - Fitness Tracking & Community" />
    <meta property="og:description" content="Track your fitness journey, connect with trainers, find gyms, and share your progress with our community." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fittrack-app.com" />
    <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitTrack - Fitness Tracking & Community" />
    <meta name="twitter:description" content="Track your fitness journey, connect with trainers, find gyms, and share your progress." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo192.png" />
    
    <!-- PWA Manifest -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    
    <title>FitTrack - Fitness Tracking & Community Platform</title>
    
    <style>
      /* Critical CSS for initial loading */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
        color: #333;
        line-height: 1.6;
      }
      
      /* Loading screen styles */
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      .loading-text {
        font-size: 1.2rem;
        font-weight: 500;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading screen when app loads */
      .app-loaded #initial-loading {
        display: none;
      }
      
      /* Ensure root element takes full height */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Basic typography */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 600;
        line-height: 1.25;
        margin-bottom: 0.5rem;
      }
      
      p {
        margin-bottom: 1rem;
      }
      
      /* Focus styles for accessibility */
      *:focus {
        outline: 2px solid #007bff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this application.</p>
        <p>FitTrack is a modern web application that requires JavaScript for full functionality.</p>
        <p>Please enable JavaScript in your browser settings and refresh the page.</p>
      </div>
    </noscript>
    
    <!-- Initial loading screen -->
    <div id="initial-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading FitTrack...</div>
    </div>
    
    <!-- React app root -->
    <div id="root"></div>
    
    <!-- Performance monitoring script -->
    <script>
      // Performance monitoring
      window.addEventListener('load', function() {
        // Remove initial loading screen
        document.body.classList.add('app-loaded');
        
        // Log performance metrics
        if ('performance' in window) {
          const perfData = window.performance.timing;
          const loadTime = perfData.loadEventEnd - perfData.navigationStart;
          console.log('Page load time:', loadTime + 'ms');
        }
        
        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(registration) {
                console.log('SW registered: ', registration);
              })
              .catch(function(registrationError) {
                console.log('SW registration failed: ', registrationError);
              });
          });
        }
      });
      
      // Error boundary for unhandled errors
      window.addEventListener('error', function(e) {
        console.error('Unhandled error:', e.error);
        // You can send this to your error tracking service
      });
      
      // Handle offline/online events
      window.addEventListener('online', function() {
        console.log('Application is online');
        // You can trigger sync operations here
      });
      
      window.addEventListener('offline', function() {
        console.log('Application is offline');
        // You can show offline indicator
      });
    </script>
  </body>
</html>
